<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: en Chrome para Android el teclado achica la página (como en
         la app), así las barras fijas de abajo, como la del editor de apuntes, quedan encima del teclado -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0F224C" />
    <meta name="description" content="Agenda Universitaria Offline-First: Gestiona horarios de clase, directorio de profesores y apuntes clasificados por materia." />
    <meta name="author" content="Jorge I. Barrera V." />
    <!-- Agenda Universitaria PWA - "POR Y PARA LOS ESTUDIANTES" - Desarrollada por Jorge I. Barrera V. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgendaUni" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap: https://ssl.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:;" />
    <title>Agenda Universitaria | Horarios, Profesores y Apuntes</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('agenda_universitaria_settings');
          var theme = stored ? JSON.parse(stored).theme : 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
          // Tamaño del texto antes de pintar (ver TEXT_SCALE_FACTORS en settings/types.ts)
          var scales = { small: 0.9, normal: 1, large: 1.15, xlarge: 1.3 };
          var textScale = stored ? scales[JSON.parse(stored).textScale] : undefined;
          if (textScale) {
            document.documentElement.style.setProperty('--text-scale', String(textScale));
            document.documentElement.setAttribute('data-text-scale', JSON.parse(stored).textScale);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
