<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F224C" />
    <meta name="description" content="Agenda Universitaria Offline-First: Gestiona horarios de clase, directorio de profesores y apuntes clasificados por materia." />
    <meta name="author" content="Jorge I. Barrera V." />
    <!-- Agenda Universitaria PWA - "POR Y PARA LOS ESTUDIANTES" - Desarrollada por Jorge I. Barrera V. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgendaUni" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap: https://ssl.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:;" />
    <title>Agenda Universitaria | Horarios, Profesores y Apuntes</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('agenda_universitaria_settings');
          var theme = stored ? JSON.parse(stored).theme : 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
