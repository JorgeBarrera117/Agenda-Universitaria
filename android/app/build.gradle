apply plugin: 'com.android.application'

/*
 * Llave de publicación (Google Play). Se lee de android/keystore.properties, que NUNCA se sube a
 * GitHub (.gitignore). Sin ese archivo todo sigue como siempre: las compilaciones usan la llave de
 * depuración y solo la versión «play» de publicación (bundlePlayRelease) se niega a compilar.
 * Formato (ver docs/play-store/guia-publicacion.md):
 *   storeFile=C:/ruta/a/agenda-upload.jks
 *   storePassword=...
 *   keyAlias=agenda-upload
 *   keyPassword=...
 */
def releaseKeyProps = new Properties()
def releaseKeyFile = rootProject.file('keystore.properties')
if (releaseKeyFile.exists()) {
    releaseKeyFile.withInputStream { releaseKeyProps.load(it) }
}
def hasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseKeyProps[it] }

android {
    namespace = "com.agenda.universitaria"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agenda.universitaria"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 171094
        versionName "1.7.10.94"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Dos versiones desde el mismo código (todo lo demás se comparte: src/main y la web):
     * - github: el APK de GitHub Releases, que se actualiza sola desde la app (como siempre).
     * - play:   para Google Play. Sin el actualizador propio ni el permiso para instalar paquetes;
     *           las actualizaciones las instala la tienda.
     * Mismo applicationId y versionCode: solo cambia cómo llegan las actualizaciones.
     */
    flavorDimensions = ['distribution']
    productFlavors {
        github {
            dimension 'distribution'
            isDefault = true
        }
        play {
            dimension 'distribution'
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKeyProps['storeFile'])
                storePassword releaseKeyProps['storePassword']
                keyAlias releaseKeyProps['keyAlias']
                keyPassword releaseKeyProps['keyPassword']
            }
        }
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Con la llave de publicación si existe; si no, la de depuración (como hasta ahora)
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Desbloqueo de la agenda con huella o bloqueo de pantalla (Ajustes → Bloqueo de la app)
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

/*
 * Salvaguardas de la versión de Google Play:
 * 1. Nunca se firma un paquete de Play con la llave de depuración (Google lo rechazaría y, peor,
 *    quedaría asociado a una llave pública conocida por cualquiera).
 * 2. El manifiesto final de «play» no puede pedir REQUEST_INSTALL_PACKAGES: si un cambio futuro
 *    (o un plugin) lo vuelve a agregar, la compilación se detiene en vez de subirse así a la tienda.
 */
gradle.taskGraph.whenReady { graph ->
    def buildsPlayRelease = graph.allTasks.any { it.project == project && it.name ==~ /(bundle|assemble)PlayRelease/ }
    if (buildsPlayRelease && !hasReleaseKey) {
        throw new GradleException(
            'Falta la llave de publicación: crea android/keystore.properties (ver docs/play-store/guia-publicacion.md).'
        )
    }
}

afterEvaluate {
    tasks.matching { it.name ==~ /processPlay(Debug|Release)Manifest/ }.configureEach { task ->
        task.doLast {
            task.outputs.files.asFileTree.matching { include '**/AndroidManifest.xml' }.each { manifest ->
                if (manifest.text.contains('android.permission.REQUEST_INSTALL_PACKAGES')) {
                    throw new GradleException(
                        "La versión de Google Play no puede pedir REQUEST_INSTALL_PACKAGES (${manifest})."
                    )
                }
            }
        }
    }
}
