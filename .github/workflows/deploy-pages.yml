name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - feature/subject-documents-prototype
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages de forma segura
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente, descartando ejecuciones intermedias
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipado y compilar producción PWA
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de construcción
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
